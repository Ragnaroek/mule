[package]
name = "mule-viewer"
version = "0.1.0"
edition = "2024"

[features]
web = []
debug = []

[dependencies]
eframe = "0.35.0"
egui = "0.35.0"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
log = "0.4.33"
web-sys = { version = "0.3.103", features = ["FileList", "File", "HtmlInputElement"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
gloo-net = "0.7.0"
rfd = "0.17.2"
poll-promise = { version = "0.3.0", features = ["web"] }

mule_gb = { path = "../mule-gb/" }
psy = { path = "../../../psy/" }

[profile.release]
opt-level = "s"
